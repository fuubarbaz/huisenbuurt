/** Start a watch-loop cycle from the browser.
 *
 *  The same work as `uv run woonagent --once`, so the shortlist can be filled
 *  without a terminal. A cycle runs for minutes — up to 25 listings, each with
 *  a politeness pause and about a dozen enrichment calls — so the button only
 *  accepts the job and this polls for progress.
 *
 *  The server refuses a second concurrent cycle with 409 rather than queueing
 *  it, and this reflects that instead of pretending the click worked.
 */
const REGIONS_KEY = "woonagent.run.regions";

function RunConsole({ onFinished }) {
  const [run, setRun] = useState(null);
  const [error, setError] = useState(null);
  const [regions, setRegions] = useState(() => {
    try { return localStorage.getItem(REGIONS_KEY) || ""; } catch { return ""; }
  });
  const wasRunning = useRef(false);

  useEffect(() => {
    try { localStorage.setItem(REGIONS_KEY, regions); } catch { /* private window */ }
  }, [regions]);

  const poll = useCallback(async () => {
    try {
      const res = await fetch("/run");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const body = await res.json();
      setRun(body);
      // Refresh the shortlist the moment a cycle stops, not on the next click.
      if (wasRunning.current && !body.running) onFinished?.();
      wasRunning.current = body.running;
      return body.running;
    } catch (err) {
      setError(explain(err));
      return false;
    }
  }, [onFinished]);

  useEffect(() => {
    let timer;
    let live = true;
    const tick = async () => {
      const running = await poll();
      if (!live) return;
      timer = setTimeout(tick, running ? 1500 : 8000);
    };
    tick();
    return () => { live = false; clearTimeout(timer); };
  }, [poll]);

  async function trigger() {
    setError(null);
    try {
      const res = await fetch("/run", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ regions: regions.trim() || null }),
      });
      const body = await res.json();
      if (res.status === 409) throw new Error(body.detail);
      if (!res.ok) throw new Error(detailOf(body, res.status));
      setRun(body);
      wasRunning.current = true;
    } catch (err) {
      setError(explain(err));
    }
  }

  async function stop() {
    setError(null);
    try { await fetch("/run", { method: "DELETE" }); } catch { /* poll will show it */ }
    poll();
  }

  const status = run?.status || "idle";
  const running = !!run?.running;
  const WORD = { idle: "Never run", running: "Running", done: "Finished",
                 failed: "Failed", cancelled: "Cancelled" };

  return (
    <Panel title="Watch loop"
           note="Scrape Huispedia for new listings, enrich, score, and alert on anything above your threshold. The same cycle the agent runs on a timer.">
      <div className="fields" style={{ marginBottom: "var(--s3)" }}>
        <div className="span-4">
          <label htmlFor="rg">Region <em>· optional</em></label>
          <input id="rg" value={regions} onChange={(e) => setRegions(e.target.value)}
                 disabled={running}
                 placeholder="e.g. Amsterdam, Amstelveen, 1018 — blank watches the whole country" />
        </div>
      </div>

      <div className="runbar">
        <button className="btn btn-primary" onClick={trigger} disabled={running}>
          {running && <span className="spinner" />}
          {running ? "Running…" : "Run one cycle"}
        </button>
        {running && <button className="btn btn-ghost" onClick={stop}>Stop</button>}
        <span className={"runstate " + status}>{WORD[status] || status}</span>
        {run?.alerts_sent != null && !running && (
          <span className="hint">
            {run.alerts_sent}{" "}
            {run.alerts_enabled === false
              ? "scored above your threshold — no Telegram configured, so nothing was sent"
              : "alert(s) sent"}
          </span>
        )}
        {run?.started_at && (
          <span className="hint">started {run.started_at.replace("T", " ").replace("+00:00", " UTC")}</span>
        )}
      </div>

      {error && <p className="err" role="alert">{error}</p>}
      {run?.error && <p className="err">{run.error}</p>}

      {run?.log?.length > 0 && (
        <div className="runlog" aria-live="polite">{run.log.join("\n")}</div>
      )}

      <p className="footnote">
        One cycle at a time — a second request is refused rather than queued, because
        two concurrent cycles would double the load on every upstream API. Runs in this
        server process, so it stops if the server stops. For continuous monitoring use
        {" "}<code>uv run woonagent</code> instead, which polls every 5–15 minutes.
        {" "}Leaving the region blank watches every listing in the Netherlands — set one
        before relying on this unattended, or set <code>WOONAGENT_REGIONS</code> for the
        continuous daemon.
      </p>
    </Panel>
  );
}

const COMPARE_DIMENSIONS = Object.keys(LABEL);

/** Side by side, everything scored so far in this browser.
 *
 *  Deliberately client-side and localStorage-backed, like the commute
 *  destinations: there is no server concept of "the addresses this visitor is
 *  weighing up", and building one would mean accounts for a personal tool
 *  that otherwise has none. Scoring an address again always overwrites the
 *  same slot (keyed on property_id), so re-scoring after moving a weight
 *  slider keeps the comparison current instead of piling up duplicates.
 */
function CompareTab() {
  const [rows, setRows] = useState(() => loadCompareList());

  function remove(propertyId) {
    const next = rows.filter((r) => r.property_id !== propertyId);
    setRows(next);
    saveCompareList(next);
  }

  function clearAll() {
    setRows([]);
    saveCompareList([]);
  }

  if (rows.length === 0) {
    return (
      <Panel title="Compare"
             note="Score two or more addresses on the Score tab, then use “Add to comparison” to see them side by side here.">
        <p className="empty">Nothing to compare yet.</p>
      </Panel>
    );
  }

  const bestScore = Math.max(...rows.map((r) => r.total_score));
  const bestByDim = Object.fromEntries(COMPARE_DIMENSIONS.map((key) => [
    key, Math.max(...rows.map((r) =>
      r.dimensions.find((d) => d.dimension === key)?.score ?? -Infinity)),
  ]));
  const flagCounts = (flags) => {
    const by = { critical: 0, warn: 0, info: 0 };
    for (const f of flags) if (f.severity in by) by[f.severity]++;
    return by;
  };

  return (
    <Panel title="Compare" scope={`${rows.length}/${MAX_COMPARE}`}
           note="Addresses you have scored and chosen to compare. Stored in this browser only.">
      <div className="scroll-x">
        <table>
          <thead>
            <tr>
              <th>&nbsp;</th>
              {rows.map((r) => (
                <th key={r.property_id} className="num" style={{ minWidth: 160 }}>
                  <div style={{ fontWeight: 700, color: "var(--ink)", textTransform: "none",
                               letterSpacing: 0, fontSize: "var(--fs-md)" }}>
                    {r.url ? <a href={r.url} target="_blank" rel="noreferrer">{r.address}</a>
                           : r.address}
                  </div>
                  <div className="facts" style={{ fontSize: "var(--fs-xs)" }}>
                    {[r.buurt, r.gemeente].filter(Boolean).join(" · ")}
                  </div>
                  <button className="link-btn" onClick={() => remove(r.property_id)}
                          style={{ marginTop: 4 }}>
                    Remove
                  </button>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Overall</td>
              {rows.map((r) => (
                <td key={r.property_id} className="num">
                  <span className="pill" style={{ background: hue(r.total_score),
                                                   outline: r.total_score === bestScore
                                                     ? "2px solid var(--good)" : "none" }}>
                    {r.total_score.toFixed(1)}
                  </span>
                </td>
              ))}
            </tr>
            {COMPARE_DIMENSIONS.map((key) => (
              <tr key={key}>
                <td>{LABEL[key]}</td>
                {rows.map((r) => {
                  const dim = r.dimensions.find((d) => d.dimension === key);
                  if (!dim) return <td key={r.property_id} className="num muted">—</td>;
                  const best = dim.score === bestByDim[key] && !dim.imputed;
                  return (
                    <td key={r.property_id} className="num">
                      <span style={{ color: hue(dim.score), fontWeight: best ? 700 : 500 }}>
                        {dim.score.toFixed(1)}
                      </span>
                      {dim.imputed && <span className="muted"> · no data</span>}
                    </td>
                  );
                })}
              </tr>
            ))}
            <tr>
              <td>Asking price</td>
              {rows.map((r) => (
                <td key={r.property_id} className="num">{euros(r.price_eur) || "—"}</td>
              ))}
            </tr>
            <tr>
              <td>€/m²</td>
              {rows.map((r) => (
                <td key={r.property_id} className="num">{euros(r.price_per_m2) || "—"}</td>
              ))}
            </tr>
            <tr>
              <td>Floor area</td>
              {rows.map((r) => (
                <td key={r.property_id} className="num">
                  {r.living_area_m2 ? `${r.living_area_m2} m²` : "—"}
                </td>
              ))}
            </tr>
            <tr>
              <td>Built</td>
              {rows.map((r) => (
                <td key={r.property_id} className="num">{r.construction_year || "—"}</td>
              ))}
            </tr>
            <tr>
              <td>Energy label</td>
              {rows.map((r) => (
                <td key={r.property_id} className="num">{r.energy_label || "—"}</td>
              ))}
            </tr>
            <tr>
              <td>Watch out</td>
              {rows.map((r) => {
                const c = flagCounts(r.risk_flags);
                const parts = [
                  c.critical && <span key="c" style={{ color: "var(--crit)" }}>{c.critical} critical</span>,
                  c.warn && <span key="w" style={{ color: "var(--mid)" }}>{c.warn} warning</span>,
                  c.info && <span key="i" className="muted">{c.info} note</span>,
                ].filter(Boolean);
                return (
                  <td key={r.property_id} className="num">
                    {parts.length ? parts.reduce((a, b) => [a, " · ", b]) : <span className="muted">none</span>}
                  </td>
                );
              })}
            </tr>
          </tbody>
        </table>
      </div>

      <div className="actions" style={{ marginTop: "var(--s4)" }}>
        <button className="btn btn-ghost" onClick={clearAll}>Clear all</button>
      </div>
    </Panel>
  );
}

//: Short display names, matching exactly what the Score tab's own dimension
//: bars already say — a national map using different words for the same
//: five things would read as a different scoring system.
const MAP_DIM_LABEL = {
  safety: "Safety", family: "Families", education: "Schools",
  environment: "Environment", structural: "Foundation",
};
const MAP_DIMENSIONS = Object.keys(MAP_DIM_LABEL);

/** The weighted composite for one buurt under the current sliders.
 *
 *  Re-normalised over whichever dimensions this buurt actually has — the
 *  exact same rule POST /rescore applies server-side for one address,
 *  reimplemented here in the browser because recomputing 14,000+ addresses
 *  through a network round trip on every slider drag is not workable, and
 *  nothing about the maths needs a server: it is a weighted average over
 *  numbers already sitting in memory.
 */
function buurtComposite(properties, weights) {
  let weightedSum = 0;
  let weightTotal = 0;
  for (const key of MAP_DIMENSIONS) {
    const value = properties[key];
    if (value == null) continue;
    const w = weights[key] ?? 0;
    weightedSum += w * value;
    weightTotal += w;
  }
  return weightTotal > 0 ? weightedSum / weightTotal : null;
}

/** Countrywide, one composite score per CBS buurt.
 *
 *  Built from a completely separate pipeline (``scripts/build_national_map.py``)
 *  and a completely separate store (DuckDB, not the personal watch-loop
 *  SQLite database) — see that script's module docstring for why, and for the
 *  honest, measured runtime (roughly 9 hours for the whole country; RIVM's
 *  conservative default rate limit, not a bug, is what sets that ceiling).
 *  The map below renders whatever fraction of the country has been scored so
 *  far — a build in progress is still useful to look at, not just the
 *  finished thing.
 */
//: The Netherlands' own bounding box, taken from PDOK's own GetCapabilities
//: for this exact buurten dataset — not a guessed rectangle. A small margin
//: is added so edge buurten (Zeeland, the Wadden islands) are not clipped
//: right at the pan limit.
const NL_BOUNDS = [[50.6, 2.9], [53.7, 7.5]];

function NationalMapTab() {
  const [geojson, setGeojson] = useState(null);
  const [error, setError] = useState(null);
  const [weights, setWeights] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(WEIGHTS_KEY) || "null");
      if (saved) {
        // The Score tab stores full ScoreDimension keys; translate to this
        // tab's short names so the same slider state is shared between them.
        return {
          safety: saved.physical_safety, family: saved.peer_family_concentration,
          education: saved.education_quality_access, environment: saved.environmental_health,
          structural: saved.structural_security,
        };
      }
    } catch { /* private window, cleared storage */ }
    return null;
  });
  const [defaults, setDefaults] = useState(null);
  const mapRef = useRef(null);
  const mapObj = useRef(null);
  const layerRef = useRef(null);

  useEffect(() => {
    fetch("/weights").then((r) => (r.ok ? r.json() : null)).then((d) => {
      if (!d) return;
      const short = {
        safety: d.physical_safety, family: d.peer_family_concentration,
        education: d.education_quality_access, environment: d.environmental_health,
        structural: d.structural_security,
      };
      setDefaults(short);
      setWeights((prev) => prev || short);
    }).catch(() => {});
  }, []);

  useEffect(() => {
    fetch("/national-map").then(async (r) => {
      const body = await r.json();
      if (!r.ok) throw new Error(detailOf(body, r.status));
      return body;
    }).then(setGeojson).catch((err) => setError(explain(err)));
  }, []);

  const styleFor = useCallback((feature) => {
    const composite = buurtComposite(feature.properties, weights || {});
    return {
      fillColor: composite == null ? "var(--muted)" : hue(composite),
      fillOpacity: 0.75, color: "var(--line-2)", weight: 0.5,
    };
  }, [weights]);

  // Create the map once; Leaflet owns this DOM node from here on, which is
  // why it is a ref and not JSX — React re-rendering the div would fight
  // Leaflet for control of its own children.
  useEffect(() => {
    if (!mapRef.current || mapObj.current) return;
    const map = L.map(mapRef.current, {
      maxBounds: NL_BOUNDS, maxBoundsViscosity: 1.0, zoomSnap: 0.25,
      attributionControl: false,
    });
    // Crediting the actual source of what is drawn — CBS's boundaries via
    // PDOK — now that there is no OpenStreetMap tile layer underneath to
    // carry its own required attribution.
    L.control.attribution({ prefix: "Leaflet" })
      .addAttribution('Buurtgrenzen: <a href="https://www.cbs.nl/">CBS</a> via '
                      + '<a href="https://www.pdok.nl/">PDOK</a>')
      .addTo(map);

    // Deliberately NO base tile layer. PDOK's own vectortile-viewer — the
    // exact comparison this was built to match — renders only its Dutch data
    // on a blank background; there is no world basemap sitting underneath
    // for a neighbouring country to appear on. A raster layer like OSM
    // covers the entire globe by definition, so however tightly the view is
    // fit, panning or a wide viewport will always reveal Belgium or Germany
    // sitting right there on the same tiles. The 14,668 buurt polygons
    // already tile edge-to-edge into the country's own outline, so they are
    // the whole picture; a plain background (see .leaflet-container's CSS)
    // stands in for "no basemap" the same way PDOK's blank canvas does.
    //
    // getBoundsZoom computes the tightest zoom that still contains the whole
    // country for THIS container's actual current size — not a fixed guess,
    // which is exactly why one fixed value under-constrained a wider window.
    const fitToNetherlands = () => {
      const tightest = map.getBoundsZoom(NL_BOUNDS);
      map.setMinZoom(tightest);
      map.fitBounds(NL_BOUNDS);
    };
    fitToNetherlands();

    // Refit on resize: a container that changes shape (window resize, a
    // sidebar toggling, rotating a phone) needs a new tightest zoom, or the
    // old one either over- or under-constrains the new shape.
    const onResize = () => { map.invalidateSize(); fitToNetherlands(); };
    window.addEventListener("resize", onResize);

    mapObj.current = map;
    return () => {
      window.removeEventListener("resize", onResize);
      map.remove();
      mapObj.current = null;
    };
  }, []);

  // (Re)draw the choropleth whenever the data or the weighting changes.
  useEffect(() => {
    const map = mapObj.current;
    if (!map || !geojson) return;
    if (layerRef.current) map.removeLayer(layerRef.current);

    const layer = L.geoJSON(geojson, {
      style: styleFor,
      onEachFeature: (feature, lyr) => {
        lyr.on("mouseover", () => lyr.setStyle({ weight: 2, color: "var(--accent)" }));
        lyr.on("mouseout", () => lyr.setStyle(styleFor(feature)));
        const p = feature.properties;
        const composite = buurtComposite(p, weights || {});
        const rows = MAP_DIMENSIONS.map((key) => (
          `<div class="row"><span>${MAP_DIM_LABEL[key]}</span> <strong>${
            p[key] != null ? p[key].toFixed(1) : "—"}</strong></div>`
        )).join("");
        lyr.bindPopup(
          `<div class="natmap-popup">
             <h3>${p.buurtnaam || p.buurtcode}</h3>
             <div class="facts">${p.gemeentenaam || ""}</div>
             <div class="row"><span>Overall</span> <strong>${
               composite != null ? composite.toFixed(1) : "—"}</strong></div>
             ${rows}
           </div>`
        );
      },
    }).addTo(map);
    layerRef.current = layer;
  }, [geojson, styleFor]);

  const setWeight = (key) => (e) => {
    const next = { ...(weights || {}), [key]: Number(e.target.value) };
    setWeights(next);
    try {
      localStorage.setItem(WEIGHTS_KEY, JSON.stringify({
        physical_safety: next.safety, peer_family_concentration: next.family,
        education_quality_access: next.education, environmental_health: next.environment,
        structural_security: next.structural,
      }));
    } catch { /* fine */ }
  };

  const coverage = geojson
    ? `${nl(geojson.scored_buurten)} of ${nl(geojson.total_buurten)} buurten scored`
      + (geojson.total_buurten ? ` (${Math.round(100 * geojson.scored_buurten / geojson.total_buurten)}%)` : "")
    : null;

  return (
    <Panel title="National map" scope="every scored buurt"
           note="One composite score per CBS buurt, coloured the same way as an individual address. Fills in as the batch build runs — a partial map is still real data, not a placeholder.">
      {error && <div className="banner banner-bad" role="alert"><div>{error}</div></div>}

      {geojson && (
        <>
          <div className="natmap-controls">
            <div className="natmap-legend">
              <span className="natmap-swatch" style={{ background: "var(--good)" }} /> 7+
              <span className="natmap-swatch" style={{ background: "var(--mid)" }} /> 5–7
              <span className="natmap-swatch" style={{ background: "var(--bad)" }} /> below 5
              <span className="natmap-swatch" style={{ background: "var(--muted)" }} /> not yet scored
            </div>
            <span className="hint">{coverage}</span>
          </div>

          <div className="sliders" style={{ marginBottom: "var(--s4)" }}>
            {MAP_DIMENSIONS.map((key) => {
              const value = (weights || {})[key] ?? 0;
              const total = MAP_DIMENSIONS.reduce((a, k) => a + ((weights || {})[k] ?? 0), 0);
              const share = total > 0 ? (value / total) * 100 : 0;
              return (
                <div className={"slider" + (value === 0 ? " is-off" : "")} key={key}>
                  <label htmlFor={`nm-${key}`}>{MAP_DIM_LABEL[key]}</label>
                  <input id={`nm-${key}`} type="range" min="0" max="0.5" step="0.01"
                         value={value} onChange={setWeight(key)} />
                  <span className="slider-pct">{share.toFixed(0)}%</span>
                </div>
              );
            })}
          </div>
        </>
      )}

      <div className="natmap" ref={mapRef} />

      <p className="footnote">
        Each buurt is scored at its own centroid, run through the exact same engine as
        scoring one address — but with no single building, so foundation risk and
        construction year fall back to the area's own averages. This is an overview
        for spotting promising areas, not a substitute for scoring the actual house.
      </p>
    </Panel>
  );
}

function ShortlistTab() {
  const [rows, setRows] = useState(null);
  const [error, setError] = useState(null);

  const load = useCallback(async () => {
    setError(null);
    try {
      const res = await fetch("/properties?limit=50");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      setRows(await res.json());
    } catch (err) {
      setError(explain(err));
    }
  }, []);

  useEffect(() => { load(); }, [load]);

  if (error) return (
    <>
      <RunConsole onFinished={load} />
      <div className="banner banner-bad" role="alert"><div>{error}</div></div>
    </>
  );
  if (rows === null) {
    return (
      <section className="panel" aria-busy="true">
        {[0, 1, 2].map((i) => <div className="sk sk-line" key={i} style={{ width: `${90 - i * 18}%` }} />)}
      </section>
    );
  }

  return (
    <>
    <RunConsole onFinished={load} />
    <Panel title="Scored by the watch loop"
           note="Everything the agent has found and scored, best first. Reads the local store, so it works with the agent stopped.">
      {rows.length === 0 ? (
        <p className="empty">
          Nothing yet. Run <code>uv run woonagent --once</code> to populate the store.
        </p>
      ) : (
        <div className="scroll-x">
          <table>
            <thead>
              <tr><th>Score</th><th>Address</th><th className="num">Price</th><th className="num">m²</th></tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.property_id}>
                  <td>
                    <span className="pill" style={{ background: hue(r.total_score) }}>
                      {r.total_score.toFixed(1)}
                    </span>
                  </td>
                  <td>
                    {r.url ? <a href={r.url} target="_blank" rel="noreferrer">{r.address}</a>
                           : r.address}
                  </td>
                  <td className="num">{euros(r.price_eur) || "—"}</td>
                  <td className="num">{r.living_area_m2 || "—"}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </Panel>
    </>
  );
}

/* ---- shell ------------------------------------------------------------ */

const TABS = [["score", "Score"], ["compare", "Compare"], ["list", "Shortlist"], ["map", "Map"]];

function App() {
  const [tab, setTab] = useState("score");
  const [theme, cycleTheme] = useTheme();
  const tabRefs = useRef({});

  /* Arrow keys move between tabs, which is what a tablist is expected to do. */
  function onTabKey(e) {
    const i = TABS.findIndex(([id]) => id === tab);
    const next = e.key === "ArrowRight" ? i + 1 : e.key === "ArrowLeft" ? i - 1 : null;
    if (next == null) return;
    e.preventDefault();
    const [id] = TABS[(next + TABS.length) % TABS.length];
    setTab(id);
    tabRefs.current[id]?.focus();
  }

  return (
    <>
      <header className="appbar">
        <div className="appbar-in">
          <div className="brand">
            <b>🏡 WoonAgent</b>
            <span>Dutch housing intelligence</span>
          </div>
          <div className="tabs" role="tablist" aria-label="Views" onKeyDown={onTabKey}>
            {TABS.map(([id, label]) => (
              <button key={id} className="tab" role="tab" aria-selected={tab === id}
                      tabIndex={tab === id ? 0 : -1}
                      ref={(el) => { tabRefs.current[id] = el; }}
                      onClick={() => setTab(id)}>
                {label}
              </button>
            ))}
          </div>
          <button className="icon-btn" onClick={cycleTheme}
                  title={`Theme: ${theme}`} aria-label={`Theme: ${theme}. Click to change.`}>
            {THEME_ICON[theme]}
          </button>
        </div>
      </header>

      <main className="wrap" id="main">
        <OfflineBanner />
        {tab === "score" && <ScoreTab onExploreMap={() => setTab("map")} />}
        {tab === "compare" && <CompareTab />}
        {tab === "list" && <ShortlistTab />}
        {tab === "map" && <NationalMapTab />}
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
